name: adaptive_video_player
description: "A Flutter video player for YouTube and direct video URLs with adaptive controls. Supports Android, iOS, Windows, macOS, Linux, and Web."
version: 2.0.0
homepage: https://github.com/ahmedalam782/vidoes_player
repository: https://github.com/ahmedalam782/vidoes_player
issue_tracker: https://github.com/ahmedalam782/vidoes_player/issues

environment:
  sdk: ">=3.1.0 <4.0.0"

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

topics:
  - video-player
  - youtube
  - streaming
  - hls
  - cross-platform

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.3
  video_player: ^2.14.1
  video_player_platform_interface: ^6.9.0
  video_player_media_kit: ^2.0.0
  video_player_win: ^3.3.0
  media_kit_libs_windows_video: ^1.0.11
  media_kit_libs_linux: ^1.2.1
  web: ^1.1.1
  ffi: ^2.2.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  webview_flutter_platform_interface: ^2.15.1

flutter:
  uses-material-design: true
